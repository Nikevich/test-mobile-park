version: "3.9"

services:

  ubuntu-app:
    image: my-ubuntu-app
    command: ["sleep", "infinity"]

    environment:
      - HOSTNAME={{.Node.Hostname}}

    networks:
      - db-postgres-net
      - ds-redis-net

    volumes:
      - ubuntu_logs:/var/log/ubuntu-app

    deploy:
      replicas: 2

      placement:
        constraints:
          - node.labels.SERVERTYPE == worker

      resources:
        limits:
          cpus: "1.0"
          memory: 500M

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

      restart_policy:
        condition: any

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  # PostgreSQL

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    networks:
      - db-postgres-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.SERVERTYPE == worker
      resources:
        limits:
          cpus: "1.0"
          memory: 500M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis

  redis:
    image: redis:7
    command: redis-server --requirepass redis_nik --save 60 1 --loglevel warning
    networks:
      - ds-redis-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.SERVERTYPE == worker
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  db-postgres-net:
    external: true

  ds-redis-net:
    external: true

volumes:
  ubuntu_logs:
    driver: local
