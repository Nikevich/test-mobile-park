- name: Create users
  hosts: all
  become: True

  vars:
    admin_users:
      - admin-1
      - admin-2
      - admin-3

    technic_users:
      - autodeploy

  tasks:

    - name: creating admin users
      user:
        name: "{{ item }}"
        password: "{{ '123' | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: yes
        state: present
      loop: "{{ admin_users }}"

    - name: creating technic users
      user:
        name: "{{ item }}"
        password: "{{ '123' | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: no
        state: present
      loop: "{{ technic_users }}"

    - name: Add authorized keys for users
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('file', '../files/authorized_keys') }}"
        state: present
        exclusive: false
      loop: "{{ admin_users }}"
