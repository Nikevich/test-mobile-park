- name: Create users
  hosts: all
  become: True

  tasks:
    - name: Creating loop
      user:
        name: "{{ item }}"
        password: "{{ '123' | password_hash('sha512') }}"
        shell: /bin/bash
        create_home: yes
        state: present
      loop:
        - admin-1
        - admin-2
        - admin-3
        - autodeploy
