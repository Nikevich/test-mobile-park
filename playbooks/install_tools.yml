- name: Install tools
  hosts: all
  become: True

  tasks:

    - name: installing
      apt:
        name: "{{required_packages}}"
        state: present
        update_cache: yes

    - name: check docker version
      ansible.builtin.shell: docker --version
      register: docker_version_result
      changed_when: false

    - name: show docker version
      ansible.builtin.debug:
        msg: "{{ docker_version_result.stdout }}"

    - name: install python3-pip
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: yes

    - name: install docker sdk for python
      ansible.builtin.pip:
        name: "{{ item }}"
        state: present
        executable: pip3
      become: yes
      loop:
        - jsondiff
        - docker
